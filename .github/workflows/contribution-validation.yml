name: Contribution validation

on:
  push:
    branches: [codex/development]

permissions:
  contents: read

jobs:
  relinker:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: g++
          - os: windows-latest
            compiler: g++
          - os: macos-latest
            compiler: clang++
    env:
      WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
      WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: runner.os == 'Windows'
        id: toolchain
        uses: actions/cache@v6
        with:
          path: C:\winlibs
          key: ${{ env.WINLIBS_ZIP }}
      - if: runner.os == 'Windows' && steps.toolchain.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs > /dev/null
      - if: runner.os == 'Windows'
        run: echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"
      - run: cmake -S . -B build-relinker -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DANYPS5_RELINKER_ONLY=ON -DBUILD_TESTING=ON
      - run: cmake --build build-relinker --parallel 3
      - run: ctest --test-dir build-relinker --output-on-failure --parallel 3 --timeout 30

  runtime:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            job: linux
            shell: bash
            configure: -DANYPS5_ENABLE_SPIRV_TOOLS=ON
          - os: windows-latest
            job: windows
            shell: cmd
            configure: ''
    env:
      WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
      WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - if: runner.os == 'Windows'
        id: toolchain
        uses: actions/cache@v6
        with:
          path: C:\winlibs
          key: ${{ env.WINLIBS_ZIP }}
      - if: runner.os == 'Windows' && steps.toolchain.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs > /dev/null
      - if: runner.os == 'Windows'
        run: |
          echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"
          echo 'SSL_CERT_FILE=C:\Program Files\Git\mingw64\etc\ssl\certs\ca-bundle.crt' >> "$GITHUB_ENV"
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: development-runtime-${{ matrix.job }}
          save: true
          evict-old-files: job
      - if: runner.os == 'Linux'
        name: Install lavapipe for the GPU execution tests
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers
          echo 'ANYPS5_REQUIRE_VULKAN=1' >> "$GITHUB_ENV"
      - run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ${{ matrix.configure }}
        shell: ${{ matrix.shell }}
      - run: python tools/check_test_registration.py build
        shell: ${{ matrix.shell }}
      - name: Build the changed kernel tests first
        shell: ${{ matrix.shell }}
        run: >-
          cmake --build build --parallel 3 --target
          guest_equeue_event_tests guest_socket_event_tests guest_pthread_attr_tests guest_filesystem_tests
      - name: Validate the kernel contributions
        shell: ${{ matrix.shell }}
        run: >-
          ctest --test-dir build -R "^guest_(equeue_events|socket_events|pthread_attr|filesystem)$"
          --output-on-failure --timeout 30 --parallel 2 --no-tests=error
          --output-log kernel-ctest.log --output-junit kernel-ctest.xml
      - run: cmake --build build --parallel 3
        shell: ${{ matrix.shell }}
      - run: cmake --build build --target libs --parallel 3
        shell: ${{ matrix.shell }}
      - name: Test the complete runtime
        shell: ${{ matrix.shell }}
        run: ctest --test-dir build --output-on-failure --timeout 30 --parallel 4 --output-log ctest.log --output-junit ctest.xml
        env:
          GALLIUM_OVERRIDE_CPU_CAPS: avx
      - if: ${{ !cancelled() && hashFiles('build/ctest.xml') != '' }}
        run: python tools/check_skips.py build/ctest.xml --job ${{ matrix.job }}
        shell: ${{ matrix.shell }}
      - if: ${{ !cancelled() && runner.os == 'Linux' && hashFiles('build/ctest.xml') != '' }}
        name: Capture uploads for a failing packed-texture test
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          failed = any(case.get('name') == 'agc_driver_image_packed16_load' and case.find('failure') is not None
                       for case in ET.parse('build/ctest.xml').getroot().iter('testcase'))
          if not failed:
              sys.exit(0)
          result = subprocess.run(['ctest', '--test-dir', 'build', '-R', '^agc_driver_image_packed16_load$',
                                   '--output-on-failure', '--timeout', '30', '--no-tests=error',
                                   '--output-log', 'packed-texture-diagnostic.log'],
                                  env={**os.environ, 'APS5_DUMP_TEXTURE': '256x1', 'GALLIUM_OVERRIDE_CPU_CAPS': 'avx'})
          sys.exit(result.returncode)
          PY
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.job }}-logs
          path: |
            ctest.log
            kernel-ctest.log
            packed-texture-diagnostic.log
            texture_*.raw
            build/ctest.xml
            build/kernel-ctest.xml
            build/Testing/Temporary/
            build/CMakeFiles/CMakeConfigureLog.yaml
